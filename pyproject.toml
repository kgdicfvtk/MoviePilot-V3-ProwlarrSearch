[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "moviepilot-prowlarr-search"
version = "1.0.0"
description = "MoviePilot V3 native Prowlarr torrent search plugin"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "fastapi>=0.115",
  "requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

